<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Patient Registration - Recovery Assist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <style>
        body {
            background: 
                linear-gradient(135deg, rgba(38, 174, 159, 0.4) 0%, rgba(26, 48, 45, 0.4) 100%),
                url('https://plus.unsplash.com/premium_photo-1681995460558-738a8856313c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: blur(0px);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 0;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(135deg, rgba(38, 174, 159, 0.4) 0%, rgba(26, 48, 45, 0.4) 100%),
                url('https://plus.unsplash.com/premium_photo-1681995460558-738a8856313c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: blur(6px);
            z-index: -1;
        }
        .register-container {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(38, 174, 159, 0.3);
            max-width: 550px;
            width: 90%;
         background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px);}
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .register-header p {
            color: #666;
            font-size: 0.95rem;
        }
        form {
            max-width: 100%;
            padding: 0;
            box-shadow: none;
            background: transparent;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 0.85rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        } border-radius: 20px; border-radius: 20px; border-radius: 20px;
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(38, 174, 159, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-row .form-group {
            margin-bottom: 1.5rem;
        }
        button[type="submit"] {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
         border-radius: 50px; font-family: \'Outfit\', sans-serif; border-radius: 50px; font-family: \'Outfit\', sans-serif; border-radius: 50px; font-family: \'Outfit\', sans-serif;}
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(38, 174, 159, 0.3);
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
        }
        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .login-link a:hover {
            color: var(--primary-dark);
        }
        .terms {
            font-size: 0.85rem;
            color: #666;
            margin: 1.5rem 0;
            line-height: 1.6;
        }
        .terms a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .terms a:hover {
            text-decoration: underline;
        }
        .privacy-notice {
            background: var(--secondary-bg);
            padding: 1rem;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            margin: 1.5rem 0;
            font-size: 0.9rem;
            color: #333;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .register-container {
                padding: 2rem;
             background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px);}
        }
    </style>
</head>
<body>
    <div class="register-container">
        <!-- Registration Header -->
        <div class="register-header">
            <h1><img src="{{ url_for('static', filename='logo.svg') }}" alt="Recovery Assist" class="login-logo"> Recovery Assist</h1>
            <p>Create Your Patient Account</p>
        </div>

        <!-- Privacy Notice -->
        <div class="privacy-notice">
            ✓ Your medical information is secure and HIPAA compliant
        </div>

        <!-- Registration Form -->
        <form method="POST">
            <!-- Full Name -->
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input 
                    type="text" 
                    id="name"
                    name="name" 
                    placeholder="Your full name" 
                    required
                >
            </div>

            <!-- Age and Gender Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="age">Age *</label>
                    <input 
                        type="number" 
                        id="age"
                        name="age" 
                        placeholder="Your age" 
                        min="1"
                        max="120"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input 
                    type="tel" 
                    id="phone"
                    name="phone" 
                    placeholder="+1 (555) 000-0000" 
                    required
                >
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input 
                    type="email" 
                    id="email"
                    name="email" 
                    placeholder="your.email@example.com" 
                    required
                    autocomplete="email"
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Create Password *</label>
                <input 
                    type="password" 
                    id="password"
                    name="password" 
                    placeholder="Minimum 8 characters" 
                    required
                    minlength="8"
                    autocomplete="new-password"
                >
            </div>

            <!-- Terms and Privacy -->
            <div class="terms">
                By registering, you agree to our 
                <a href="/terms">Terms of Service</a> and 
                <a href="/privacy">Privacy Policy</a>. 
                Your data is encrypted and protected.
            </div>

            <!-- Submit Button -->
            <button type="submit">Create Account</button>
        </form>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? 
            <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>
</body>
</html>
