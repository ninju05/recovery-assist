<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="24" cy="24" r="22" fill="url(#logoGradient)" stroke="#ffffff" stroke-width="2"/>

  <!-- Medical cross -->
  <rect x="20" y="12" width="8" height="24" rx="2" fill="url(#crossGradient)"/>
  <rect x="12" y="20" width="24" height="8" rx="2" fill="url(#crossGradient)"/>

  <!-- Recovery arrow -->
  <path d="M32 32 L36 28 L32 24" stroke="url(#crossGradient)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 28 L36 28" stroke="url(#crossGradient)" stroke-width="2" stroke-linecap="round"/>
</svg>